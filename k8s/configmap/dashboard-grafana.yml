apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: kafkastreamingdata
  labels:
    grafana_dashboard: "1"
data:
  producer-dashboard.json: |
    {
      "id": null,
      "title": "Kafka Producer Metrics",
      "tags": ["kafka", "producer"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "graph",
          "title": "Avg Producer Delivery Latency (ms)",
          "targets": [
            {
              "expr": "producer_avg_delivery_latency_ms",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 26, "w": 12, "h": 8 }
        }

        {
          "type": "graph",
          "title": "Message Send Rate (msg/sec)",
          "targets": [
            {
              "expr": "producer_message_rate",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
        },
        {
          "type": "graph",
          "title": "Producer Throughput (MB/sec)",
          "targets": [
            {
              "expr": "producer_mb_rate",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }
        },
        {
          "type": "graph",
          "title": "CPU Usage (%)",
          "targets": [
            {
              "expr": "producer_cpu_percent",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }
        },
        {
          "type": "graph",
          "title": "Memory Usage (%)",
          "targets": [
            {
              "expr": "producer_memory_percent",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }
        },
        {
          "type": "graph",
          "title": "Message Delivery Latency (Histogram)",
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum(rate(producer_delivery_latency_seconds_bucket[1m])) by (le))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.9, sum(rate(producer_delivery_latency_seconds_bucket[1m])) by (le))",
              "legendFormat": "P90",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(producer_delivery_latency_seconds_bucket[1m])) by (le))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 10 }
        },
        {
          "type": "stat",
          "title": "Current Target Rate",
          "targets": [
            {
              "expr": "producer_target_rate",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 26, "w": 6, "h": 4 }
        },
        {
          "type": "stat",
          "title": "Avg Message Size (bytes)",
          "targets": [
            {
              "expr": "producer_avg_msg_size_bytes",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "gridPos": { "x": 6, "y": 26, "w": 6, "h": 4 }
        }
      ]
    }

