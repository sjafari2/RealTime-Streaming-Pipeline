apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: kafkastreamingdata
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Kafka Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

