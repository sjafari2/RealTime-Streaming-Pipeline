apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: kafkastreamingdata
spec:
  ingressClassName: haproxy   # matches Nautilus’ default ingress controller
  tls:
    - hosts:
        - prometheus.kafkastreamingdata.nrp-nautilus.io
      # Optional: If you need custom cert, reference the secret here
      # secretName: prometheus-tls-secret
  rules:
    - host: prometheus.kafkastreamingdata.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090

