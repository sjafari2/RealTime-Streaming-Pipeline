apiVersion: v1
kind: PersistentVolume
metadata:
  name: producer-data
spec:
  #storageClassName: rook-cephfs-central
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  hostPath:
    path: "app/producer-data"
  affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - dtn-01.nrp.mghpcc.org  
status: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: producer-data
  namespace: "kafkastreamingdata"
spec:
  #storageClassName: rook-cephfs-central
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
status: {}
