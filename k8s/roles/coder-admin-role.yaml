apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kafkastreamingdata
  name: admin-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "create", "delete", "update"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "create", "delete", "update"]
