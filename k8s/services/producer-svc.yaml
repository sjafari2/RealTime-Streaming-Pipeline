apiVersion: v1
kind: Service
metadata:
  name: producer-headless-svc
  namespace: kafkastreamingdata
  labels:
    app: producer-workers       # Informational resource label

spec:
  clusterIP: None  # Headless service
  selector:
    app: producer-workers
  ports:
    #- name: producer-port
    #  port: 80
    #  targetPort: 8080
    - name: metrics
      port: 8001        # what Prometheus dials
      targetPort: 8001  # must match app's listening port
