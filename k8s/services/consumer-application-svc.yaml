apiVersion: v1
kind: Service
metadata:
  name: consumer-application-svc
  namespace: kafkastreamingdata
spec:
  type: ClusterIP
  ports:
    - name: consumer-port
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: application-port
      port: 81
      targetPort: 8081
      protocol: TCP
  selector:
    app: consumer-application-sts
