apiVersion: v1
kind: Service
metadata:
  name: cons-app-headless-svc
  namespace: kafkastreamingdata
  labels:
    app: consumer-application
spec:
  clusterIP: None  # Headless service for stable pod DNS
  selector:
    app: consumer-application-sts
  ports:
    - name: consumer-port
      port: 80
      targetPort: 8080
    - name: application-port
      port: 81
      targetPort: 8081

