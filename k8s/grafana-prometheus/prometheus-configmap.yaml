apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
  namespace: kafkastreamingdata
data:
  prometheus.yml: |
    global:
      # Match your Helm values (fast loops help tail-latency studies)
      scrape_interval: 5s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Discover current application pods, including consumers added during a run.
      - job_name: 'kafka-pipeline'
        metrics_path: /metrics
        scrape_interval: 2s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kafkastreamingdata]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: '(producer|consumer)-sts'
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: '(producer|consumer)-sts'
            target_label: role
            replacement: '$1'
      # Scrape each broker separately. A service address can alternate brokers.
      # The current JMX response took about 12 seconds while idle, so allow 25s.
      - job_name: 'kafka-brokers'
        scrape_interval: 30s
        scrape_timeout: 25s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kafkastreamingdata]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: pip-kafka
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: jmx-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []  # fill if you deploy Alertmanager

    rule_files:
      - /etc/prometheus/alert.rules.yml

  alert.rules.yml: |
    groups:
      - name: kafka-pipeline-alerts
        rules:
          - alert: NoMerges
            expr: time() - max(prometheus_tsdb_last_scrape_duration_seconds) > 300
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "No merges detected for over 5 minutes"
              description: "No data merges have been processed in the last 5 minutes. Check pipeline health."

          - alert: HighPodCPU
            expr: avg(rate(process_cpu_seconds_total[1m])) by (instance) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "Pod CPU usage is above 80% for 2 minutes."

          - alert: HighLateArrivalRate
            expr: merge_late_arrival_rate > 0.1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High late arrival rate in pipeline"
              description: "More than 10% of messages are arriving late. Check producer and consumer timing."

