apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consumer-sts
  namespace: kafkastreamingdata
  labels:
    app: consumer-sts
spec:
  serviceName: consumer-headless-svc
  selector:
    matchLabels:
      app: consumer-sts
  replicas: 4
  podManagementPolicy: Parallel

  template:
    metadata:
      labels:
        app: consumer-sts
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - consumer-sts
                      - producer-sts
                      - pip-kafka-controller
              topologyKey: kubernetes.io/hostname

      initContainers:
        - name: bootstrap-consumer
          image: sjafari2/kafkaconfluentconsumer:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[init] Bootstrapping config and code..."
              mkdir -p /config
              echo "[init] Copying all files from /defaults to /config..."
              cd /defaults && tar -cf - . | (cd /config && tar -xf -)
              chown -R 1000:1000 /config
              chmod -R u+w /config

              if [ ! -f /app/consumer-merge-data/.code_initialized ]; then
                echo "[init] Copying code to /app/consumer-merge-data..."
                cp -r /code/* /app/consumer-merge-data/
                touch /app/consumer-merge-data/.code_initialized
              fi
              chown -R 1000:1000 /app/consumer-merge-data
              chmod -R u+w /app/consumer-merge-data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data
            - name: shared-config
              mountPath: /config
            - name: config-default
              mountPath: /defaults

      containers:
        - name: consumer-container
          image: sjafari2/kafkaconfluentconsumer:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          workingDir: /app/consumer-merge-data
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              mkdir -p ./logs
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              echo "Loaded config files:"
              ls -l /config
              cat /config/pipeline-configmap.yaml || echo "Config file not found"
              python3 main.py  # <- Ensure your Flask app runs on 0.0.0.0:8080

          ports:
            - containerPort: 8080
              name: consumer-port
            - containerPort: 9093
              name: cons-exp-port

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"

          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data
            - name: shared-config
              mountPath: /config

      volumes:
        - name: consumer-merge-data
          persistentVolumeClaim:
            claimName: consumer-merge-data
        - name: shared-config
          persistentVolumeClaim:
            claimName: pipeline-configmap-pvc
        - name: config-default
          configMap:
            name: pipeline-configmap

