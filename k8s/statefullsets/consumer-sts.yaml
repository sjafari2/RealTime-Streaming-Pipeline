apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consumer-sts
  namespace: kafkastreamingdata
  labels:
    app: consumer-sts
    app.kubernetes.io/name: consumer-sts
spec:
  serviceName: consumer-headless-svc
  selector:
    matchLabels:
      app: consumer-sts
  replicas: 6
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: consumer-sts
        app.kubernetes.io/name: consumer-sts
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["ucsd"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: consumer-sts

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: consumer-sts

      initContainers:
      - name: bootstrap-consumer
        image: sjafari2/kafkaconfluentconsumer:latest
        command: ["/bin/sh","-c"]
        args:
          - |
            set -e
            echo "[init] Bootstrapping config and code..."

            # /config is a RWX PVC (writable). Ensure permissions.
            mkdir -p /config
            chown -R 1000:1000 /config
            chmod -R u+w /config
            
            # Seed config files only if missing
            if [ ! -f /config/pipeline-configmap.yaml ]; then
              echo "[init] Seeding pipeline-configmap.yaml from /defaults"
              cp /defaults/pipeline-configmap.yaml /config/pipeline-configmap.yaml
              chmod 644 /config/pipeline-configmap.yaml
            fi

            if [ ! -f /config/experiments.yaml ]; then
              echo "[init] Seeding experiments.yaml from /defaults"
              cp /defaults/experiments.yaml /config/experiments.yaml
              chmod 644 /config/experiments.yaml
            fi
            
            # Copy code into RWX CephFS once (keeps your existing workflow)
            if [ ! -f /app/consumer-merge-data/.code_initialized ]; then
              cp -r /code/* /app/consumer-merge-data/
              touch /app/consumer-merge-data/.code_initialized
            fi
            chown -R 1000:1000 /app/consumer-merge-data
            chmod -R u+w /app/consumer-merge-data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: consumer-merge-data
          mountPath: /app/consumer-merge-data
        - name: pipeline-config
          mountPath: /config

      containers:
      - name: consumer-container
        image: sjafari2/kafkaconfluentconsumer:latest
        imagePullPolicy: Always
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        workingDir: /app/consumer-merge-data
        env:
        - name: PIPELINE_ROLE
          value: consumer
        - name: CONSUMER_HTTP_PORT
          value: "8002"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PIPELINE_CONFIG
          value: /config/pipeline-configmap.yaml
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -e
            mkdir -p ./logs
            echo "[startup] Pod: $POD_NAME"
            echo "[startup] Config: $PIPELINE_CONFIG"
            ls -l /config || true
            # Do NOT start the workload yet; keep pod alive.
            echo "[startup] Ready. Waiting for manual start."
            tail -f /dev/null
        ports:
        - name: metrics
          containerPort: 8002
        resources:
          requests:
            cpu: "2"
            memory: "16Gi"
          limits:
            cpu: "4"
            memory: "32Gi"
        volumeMounts:
        - name: consumer-merge-data
          mountPath: /app/consumer-merge-data
        - name: pipeline-config
          mountPath: /config
        - name: metrics
          mountPath: /tmp/metrics

      volumes:
      - name: consumer-merge-data
        persistentVolumeClaim:
          claimName: consumer-merge-cephfs
      - name: pipeline-config
        persistentVolumeClaim:
          claimName: pipeline-configmap-pvc
      - name: metrics
        emptyDir: {}
