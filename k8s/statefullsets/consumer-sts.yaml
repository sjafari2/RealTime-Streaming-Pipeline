apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consumer-sts
  namespace: kafkastreamingdata
  labels:
    app: consumer-sts
spec:
  serviceName: consumer-headless-svc
  selector:
    matchLabels:
      app: consumer-sts
  replicas: 4
  podManagementPolicy: Parallel

  template:
    metadata:
      labels:
        app: consumer-sts
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - consumer-sts
              topologyKey: kubernetes.io/hostname

      initContainers:
        - name: bootstrap-consumer-code
          image: sjafari2/kafkaconfluentconsumer:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[init] Bootstrapping consumer code..."
              if [ ! -f /app/consumer-merge-data/.code_initialized ]; then
                cp -r /code/* /app/consumer-merge-data/
                touch /app/consumer-merge-data/.code_initialized
                chown -R 1000:1000 /app/consumer-merge-data
                chmod -R u+w /app/consumer-merge-data
                chown -R 1000:1000 /config
                chmod -R u+w /config
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data

        - name: config-bootstrap
          image: sjafari2/kafkaconfluentconsumer:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[init] Copying configmap if not already present..."
              mkdir -p /config
              cp /defaults/pipeline-configmap.yaml /config/pipeline-configmap.yaml || true
              chown -R 1000:1000 /config
              chmod -R u+w /config
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: shared-config
              mountPath: /config
            - name: config-default
              mountPath: /defaults

      containers:
        - name: consumer-container
          image: sjafari2/kafkaconfluentconsumer:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          workingDir: /app/consumer-merge-data
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              mkdir -p ./logs
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              echo "Loaded config file contents:"
              cat /config/pipeline-configmap.yaml
              while true; do date > /tmp/healthy; sleep 10; done

          ports:
            - containerPort: 8080
              name: consumer-port
            - containerPort: 9093
              name: cons-exp-port

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "test -f /tmp/healthy"
            initialDelaySeconds: 60
            periodSeconds: 30

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "test -f /tmp/healthy"
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"

          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data
            - name: shared-config
              mountPath: /config

      volumes:
        - name: consumer-merge-data
          persistentVolumeClaim:
            claimName: consumer-merge-data
        - name: shared-config
          persistentVolumeClaim:
            claimName: pipeline-configmap-pvc
        - name: config-default
          configMap:
            name: pipeline-configmap
            items:
              - key: pipeline-configmap.yaml
                path: pipeline-configmap.yaml

