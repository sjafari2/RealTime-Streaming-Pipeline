apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: request-sts
  namespace: kafkastreamingdata
  labels:
    app: request-sts
spec:
  serviceName: request-headless-svc
  selector:
    matchLabels:
      app: request-sts
  replicas: 1
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: request-sts
    spec:
      securityContext:
        fsGroup: 1000  # ensures mounted volumes are writable by group 1000
      initContainers:
        - name: volume-permission-fix
          image: busybox
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app || true
          volumeMounts:
            - name: request-data
              mountPath: /app/request-data
            - name: request-producer-data
              mountPath: /app/request-producer-data
      containers:
        - name: request-container
          image: sjafari2/kafkarequest:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RqstPodMntPath
              valueFrom:
                configMapKeyRef:
                  name: pipeline-configmap
                  key: RqstPodMntPath
            - name: RqstPodSharedPath
              valueFrom:
                configMapKeyRef:
                  name: pipeline-configmap
                  key: RqstPodSharedPath
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./${RqstPodSharedPath}/*
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              mkdir -p ${RqstPodSharedPath}/logs
              sleep infinity
          ports:
            - containerPort: 8080
              name: request-port
            - containerPort: 9093
              name: req-exp-port
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: request-data
              mountPath: /app/request-data
            - name: request-producer-data
              mountPath: /app/request-producer-data
      volumes:
        - name: request-data
          persistentVolumeClaim:
            claimName: request-data
        - name: request-producer-data
          persistentVolumeClaim:
            claimName: request-producer-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - gpu-04.nrp.mghpcc.org

