apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: producer-sts
  namespace: kafkastreamingdata
  labels:
    app: producer-sts
spec:
  serviceName: producer-headless-svc  # Required: reference a headless Service
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: producer-sts
  template:
    metadata:
      labels:
        app: producer-sts
    spec:
      initContainers:
        - name: volume-permission-fix
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /app  && chmod -R u+w /app"]
          securityContext:
            runAsUser: 0  # root
          volumeMounts:
            - name: request-producer-data
              mountPath: /app/request-producer-data
      containers:
        - name: producer-container
          image: sjafari2/kafkaproducer:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RqstPodSharedPath
              valueFrom:
                configMapKeyRef:
                  name: pipeline-configmap
                  key: RqstPodSharedPath
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              sleep infinity
          ports:
            - containerPort: 8080
              name: producer-port
            - containerPort: 9093
              name: prod-exp-port
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: request-producer-data
              mountPath: /app/request-producer-data
      volumes:
        - name: request-producer-data
          persistentVolumeClaim:
            claimName: request-producer-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - gpu-01.nrp.mghpcc.org

