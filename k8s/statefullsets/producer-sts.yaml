apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: producer-sts
  namespace: kafkastreamingdata
  labels:
    app: producer-sts
    app.kubernetes.io/name: producer-sts
spec:
  serviceName: producer-headless-svc
  selector:
    matchLabels:
      app: producer-sts
  replicas: 3
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: producer-sts
        app.kubernetes.io/name: producer-sts
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      # Keep near UCSD in us-west
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["ucsd"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kafka

      initContainers:
      - name: bootstrap-producer
        image: sjafari2/kafkaconfluentproducer:latest
        imagePullPolicy: Always
        command: ["/bin/sh","-c"]
        args:
          - |
            set -e
            echo "[init] Bootstrapping producer config and code..."

            # /config is a RWX PVC (writable). Ensure permissions.
            mkdir -p /config
            chown -R 1000:1000 /config
            chmod -R u+w /config

            # Seed config files only if missing
            if [ ! -f /config/pipeline-configmap.yaml ]; then
              echo "[init] Seeding pipeline-configmap.yaml from /defaults"
              cp /defaults/pipeline-configmap.yaml /config/pipeline-configmap.yaml
              chmod 644 /config/pipeline-configmap.yaml
            fi


            # Copy code into /app/producer-data once
            if [ ! -f /app/producer-data/.code_initialized ]; then
              cp -r /code/* /app/producer-data/
              touch /app/producer-data/.code_initialized
            fi
            chown -R 1000:1000 /app/producer-data
            chmod -R u+w /app/producer-data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: producer-data
          mountPath: /app/producer-data
        - name: pipeline-config
          mountPath: /config

      containers:
      - name: producer-container
        image: sjafari2/kafkaconfluentproducer:latest
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        workingDir: /app/producer-data
        env:
        - name: PIPELINE_ROLE
          value: producer
        - name: PIPELINE_CONFIG
          value: /config/pipeline-configmap.yaml

        # Match the Python producer code's expected env var
        - name: PRODUCER_HTTP_PORT
          value: "8001"

        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        command: ["/bin/bash","-lc"]
        args:
          - |
            set -e
            mkdir -p ./logs
            echo "[main] Pod: ${POD_NAME}"
            echo "[main] Using config: ${PIPELINE_CONFIG}"
            ls -l /config || true
            head -n 40 "${PIPELINE_CONFIG}" || true

            chmod +x ./run.sh

            # Do NOT start yet. You will start via your script across pods.
            echo "[main] Ready. Waiting for manual start..."
            tail -f /dev/null
        ports:
        - name: metrics
          containerPort: 8001
        - name: prod-exp-port
          containerPort: 9093
        resources:
          requests:
            memory: "1Gi"
            cpu: "2"
          limits:
            memory: "2Gi"
            cpu: "4"
        volumeMounts:
        - name: producer-data
          mountPath: /app/producer-data
        - name: pipeline-config
          mountPath: /config

      volumes:
      - name: producer-data
        persistentVolumeClaim:
          claimName: producer-data
      - name: pipeline-config
        persistentVolumeClaim:
          claimName: pipeline-config-recovery-ucsd-20260915

