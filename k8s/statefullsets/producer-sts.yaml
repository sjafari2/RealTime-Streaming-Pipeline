apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "producer-sts"
  namespace: kafkastreamingdata
  labels:
    app: "producer-sts"
spec:
  selector:
    matchLabels:
      app: "producer-sts" # This selector matches the pod labels defined below
  replicas: 1
  podManagementPolicy: Parallel
    #minReadySeconds: 10
  template:
    metadata:
      labels:
        app: "producer-sts" # Labels here must match spec.selector.matchLabels
    spec:
      initContainers:
        - name: volume-permission-fix
          image: alpine
          command: ["sh", "-c",  "chown -R 1000:1000 /app/request-producer-data"]
          volumeMounts:
          - name: request-producer-data
            mountPath: /app/request-producer-data
      containers:
        - name: "producer-container"
          image: sjafari2/kafkaproducer:latest
          securityContext:
            runAsUser: 1000  # UID for sjafari
            runAsGroup: 1000 # GID for sjafari
          env:
          - name: POD_ORDINAL
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: RqstPodSharedPath
            valueFrom:
              configMapKeyRef:
                name: pipeline-configmap
                key: RqstPodSharedPath
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              sleep infinity
          ports:
          - containerPort: 8080
            name: producer-port
          - containerPort: 9093
            name: producer-exporter-port
          - containerPort: 8888
            name: producer-notebook-port
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            # - mountPath: app/producer-data
            #  name: producer-data
          - mountPath: app/request-producer-data
            name: request-producer-data
         
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - dtn-01.nrp.mghpcc.org  
  volumeClaimTemplates:
    - metadata:
        name: request-producer-data
      spec:
        accessModes: ["ReadWriteMany"]
        storageClassName: "rook-cephfs-central"
        resources:
          requests:
            storage: "5Gi"     
           
