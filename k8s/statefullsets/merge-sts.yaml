apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "merge-sts"
  namespace: "kafkastreamingdata"
  labels:
    app: "merge-sts"
    serviceSelector: "merge-sts"
spec:
  selector:
    matchLabels:
      app: "merge-sts"
  serviceName: "merge-sts-svc"
  replicas: 1
  podManagementPolicy: Parallel
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: "merge-sts"
    spec:
      initContainers:
        - name: volume-permission-fix
          image: alpine
          command: ["sh", "-c", "chown -R 1000:1000 /app/app-merge-data && chown -R 1000:1000 /app/merged-clstr-data"]
          volumeMounts:
          - name: app-merge-data
            mountPath: /app/app-merge-data
          - name: merged-clstr-data
            mountPath: /app/merged-clstr-data
      containers:
        - name: "merge-container"
          image: sjafari2/kafkamerge:latest
          env:
          - name: POD_ORDINAL
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              sleep infinity
          ports:
          - containerPort: 9092
            name: "merge-port"
          - containerPort: 9093
            name: "exporter-port"
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "32Gi"
              cpu: "10"
          volumeMounts:
          - mountPath: app/app-merge-data
            name: app-merge-data
          - mountPath: app/merged-clstr-data
            name: merged-clstr-data
            #      restartPolicy: OnFailure
      volumes:
        - name: app-merge-data
          persistentVolumeClaim:
            claimName: app-merge-data
        - name: merged-clstr-data
          persistentVolumeClaim:
            claimName: merged-clstr-data
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - request-sts
                - merge-sts
                - consumer-sts
                - producer-sts
                - pipe-kafka-controller
                - kafka-zookeeper
            topologyKey: "kubernetes.io/hostname"
