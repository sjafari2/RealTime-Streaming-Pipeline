apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: merge-sts
  namespace: kafkastreamingdata
  labels:
    app: merge-sts
spec:
  serviceName: merge-headless-svc
  selector:
    matchLabels:
      app: merge-sts
  replicas: 1
  podManagementPolicy: Parallel

  template:
    metadata:
      labels:
        app: merge-sts
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - patternlab.calit2.optiputer.net
      initContainers:
        - name: volume-permission-and-bootstrap
          image: sjafari2/kafkaconfluentmerge:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[init] Setting permissions on target dirs..."
              chown -R 1000:1000 /app/consumer-merge-data && chmod -R u+w /app/consumer-merge-data
              chown -R 1000:1000 /app/merged-data && chmod -R u+w /app/merged-data

              echo "[init] Bootstrapping config if needed..."
              if [ ! -f /config/pipeline-configmap.yaml ]; then
                cp /defaults/pipeline-configmap.yaml /config/pipeline-configmap.yaml
              fi
              chown -R 1000:1000 /config
              chmod -R u+w /config

              echo "[init] Bootstrapping merge code if not present..."
              if [ ! -f /app/merged-data/.code_initialized ]; then
                cp -r /code/* /app/merged-data/
                touch /app/merged-data/.code_initialized
                chown -R 1000:1000 /app/merged-data
                chmod -R u+w /app/merged-data
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data
            - name: merged-data
              mountPath: /app/merged-data
            - name: shared-config
              mountPath: /config
            - name: config-default
              mountPath: /defaults

      containers:
        - name: merge-container
          image: sjafari2/kafkaconfluentmerge:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          workingDir: /app/merged-data
          command: ["/bin/bash", "-c"]
          args:
            - |
              rm -rf ./logs/*
              mkdir -p ./logs
              pod_name=$(hostname)
              ordinal=$(echo "$pod_name" | rev | cut -d '-' -f 1 | rev)
              echo "Pod ordinal value is: $ordinal"
              echo "Loaded config file contents:"
              cat /config/pipeline-configmap.yaml
              # Create /tmp/healthy periodically for probe success
              while true; do date > /tmp/healthy; sleep 10; done

          ports:
            - containerPort: 8080
              name: merge-port
            - containerPort: 9093
              name: merge-exp-port

          # Liveness and readiness probes for stability
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "test -f /tmp/healthy"
            initialDelaySeconds: 60
            periodSeconds: 30

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "test -f /tmp/healthy"
            initialDelaySeconds: 30
            periodSeconds: 15

          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"

          volumeMounts:
            - name: consumer-merge-data
              mountPath: /app/consumer-merge-data
            - name: merged-data
              mountPath: /app/merged-data
            - name: shared-config
              mountPath: /config
            - name: config-default
              mountPath: /defaults
      volumes:
        - name: consumer-merge-data
          persistentVolumeClaim:
            claimName: consumer-merge-data
        - name: merged-data
          persistentVolumeClaim:
            claimName: merged-data
        - name: shared-config
          persistentVolumeClaim:
            claimName: pipeline-configmap-pvc
        - name: config-default
          configMap:
            name: pipeline-configmap
            items:
              - key: pipeline-configmap.yaml
                path: pipeline-configmap.yaml

