  template:
    metadata:
      creationTimestamp: null
      labels:
        batch.kubernetes.io/controller-uid: 98898451-1cf6-45a3-9204-6f2739b137fe
        batch.kubernetes.io/job-name: runsynthetic-job
        controller-uid: 98898451-1cf6-45a3-9204-6f2739b137fe
        job-name: runsynthetic-job
    spec:
      containers:
      - args:
        - |
          echo "[INFO] Starting runsynthetic.sh inside producer and consumer pods..."

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          mkdir -p /results/$TIMESTAMP/producer /results/$TIMESTAMP/consumer

          for label in producer-sts consumer-sts; do
            pods=$(kubectl get pods -l app=$label -o jsonpath='{.items[*].metadata.name}')
            i=0
            for pod in $pods; do
              echo "[INFO] Executing in $pod (index $i)..."

              kubectl exec $pod -c ${label%-sts}-container -- sh -c "ps -eo pid,args | grep python | grep '\.py' | grep -v grep | awk '{print \$1}' | xargs -r kill -9 || true"
              kubectl exec $pod -c ${label%-sts}-container -- sh -c "ps -eo pid,args | grep '\.sh' | grep -v grep | awk '{print \$1}' | xargs -r kill -9 || true"

              log_path="/app/${label%-sts}-merge-data/logs"
              kubectl exec $pod -c ${label%-sts}-container -- sh -c "rm -rf ${log_path}/* || true"

              echo "[INFO] Running ./runsynthetic.sh $i"
              kubectl exec $pod -c ${label%-sts}-container -- sh -c "chmod +x ./runsynthetic.sh && ./runsynthetic.sh $i" || echo "[WARN] Failed to run in $pod"

              results_path="/app/${label%-sts}-merge-data/consumer-result"
              local_path="/results/$TIMESTAMP/${label%-sts}/$pod-result"
              mkdir -p "$local_path"
              kubectl cp "$pod:$results_path" "$local_path" -c ${label%-sts}-container || echo "[WARN] Failed to copy results from $pod"

              logs_path="/app/${label%-sts}-merge-data/logs"
              local_log_dir="/results/$TIMESTAMP/${label%-sts}/$pod-logs"
              mkdir -p "$local_log_dir"
              kubectl cp "$pod:$logs_path" "$local_log_dir" -c ${label%-sts}-container || echo "[WARN] Failed to copy logs from $pod"

              i=$((i+1))
            done
          done

          echo "[INFO] ✅ All scripts executed and results saved to /results/$TIMESTAMP"
        command:
        - /bin/bash
        - -c
        image: bitnami/kubectl:latest
        imagePullPolicy: Always
        name: runner
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 512m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /results
          name: results-volume
