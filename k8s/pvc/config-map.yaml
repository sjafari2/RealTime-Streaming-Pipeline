apiVersion: v1
kind: PersistentVolume
metadata:
  name: pipeline-configmap-pv
  namespace: "kafkastreamingdata"
spec:
  storageClassName: rook-cephfs-east
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Mi
  cephfs:
    #monitors:
    #  - <your-ceph-monitor> 
    path: /pipeline-configmap
    user: admin
    secretRef:
      name: ceph-secret
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-configmap-pvc
  namespace: "kafkastreamingdata"
spec:
  storageClassName: rook-cephfs-east
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
