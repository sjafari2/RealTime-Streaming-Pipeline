apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-configmap
  namespace: kafkastreamingdata
data:
  # Kafka Producer Settings
  TOPIC_COUNT: "10"
  TOPIC_TITLE: "kafka"
  NUM_PARTITIONS: "10"
  REPLICATION_FACTOR: "1"
  PRODUCER_COUNT: "1"
  PRODUCER_POD_COUNT: "2"
  PRODUCER_INPUT_PATH: "producer-data"
  DELAY_BETWEEN_MESSAGES: "0"       
  LINGER_MS: "20"
  BATCH_SIZE: "32768"
  COMPRESSION_TYPE: "lz4"
  MAX_REQUEST_SIZE: "2097152"
  ACKS: "1"
  RANDOM_RANGE: "50000"
  REQUEST_TIMEOUT_MS: "30000"
  DELIVERY_TIMEOUT_MS: "60000"
  QUEUE_BUFFERING_MAX_MESSAGES: "100000"
  QUEUE_BUFFERING_MAX_KBYTES: "524288"

  # Kafka Consumer Settings
  CONSUMER_GROUP_ID: "consumer-group"
  CONSUMER_COUNT: "1"
  CONSUMER_POD_COUNT: "2"
  MAX_MESSAGES: "100"                 
  ENABLE_AUTO_COMMIT: "true"
  AUTO_OFFSET_RESET: "earliest"
  POLL_TIMEOUT: "300"
  FETCH_MAX_BYTES: "10485760"
  FETCH_MIN_BYTES: "1024"
  FETCH_MAX_WAIT_MS: "500"
  CONSUMER_OUTPUT_DIR: "/app/consumer-merge-data/consumer-result"

  # Merge Pod Settings
  MERGE_COUNT: "1"
  MERGE_WAIT_TIME: "30"
  MERGE_WAIT_THRESHOLD: "5"
  MERGE_OUTPUT_DIR: "/app/consumer-merge-data/merged-result"
  MERGE_METRICS_DIR: "/app/consumer-merge-data/merge-metrics"

  # Request Simulator (Optional)
  REQUEST_COUNT: "1"
  REQUEST_URL: "http://127.0.0.1:8080/"
  REQUEST_INPUT_PATH: "./request-data/simulator"
  REQUEST_OUTPUT_PATH: "./producer-data"

  # Application Settings (Optional for post-merge processing)
  APPLICATION_WAIT_TIME: "5"
  APPLICATION_COUNT: "1"

  # BSP/Monitoring
  BSP_MODE: "true"
  PROMETHEUS_METRICS: "true"

