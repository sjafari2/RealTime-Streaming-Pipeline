base:
  
  # =============================
  #  Kafka Brokers / Topics
  # =============================
  
  RELEASE_NAME: "pip"
  NAMESPACE: "kafkastreamingdata"
  TOPIC_COUNT: "1"
  RETENTION_MS: "1800000"
  SEGMENT_MS: "600000"
  CLEANUP_POLICY: "delete"
  NUM_PARTITIONS: "100"
  BROKER_COUNT: "3"
  REPLICATION_FACTOR: "1"
  MIN_INSYNC_REPLICAS: "1"

  # =============================
  #  Kafka Producer 
  # =============================

  PRODUCER_POD_COUNT: "3"
  ACKS: "1"
  COMPRESSION_TYPE: "none"
  PRODUCER_INPUT_PATH: "producer-data"
  DELAY_BETWEEN_MESSAGES: "0"
  LINGER_MS: "0"
  BATCH_SIZE: "524288"
  COMPRESSION_TYPE: "none"
  MAX_REQUEST_SIZE: "1048576"
  ACKS: "1"
  RETRIES: "2"
  RETRY_BACKOFF_MS: "5"
  CONNECTION_MAX_IDLE_MS: "30000"
  RECONNECT_BACKOFF_MS: "100"
  RECONNECT_BACKOFF_MAX_MS: "1000"
  RANDOM_RANGE: "1000"
  REQUEST_TIMEOUT_MS: "10000"
  DELIVERY_TIMEOUT_MS: "120000"
  QUEUE_BUFFERING_MAX_MESSAGES: "200000"
  QUEUE_BUFFERING_MAX_KBYTES: "131072"
  CLIENT_ID: "pipeline-producer"
  MSG_MAX_BYTES: "1048576"
  METADATA_MAX_AGE_MS: "120000"
  TOPIC_METADATA_REFRESH_INTERVAL_MS: "120000"
  MAX_IN_FLIGHT_REQUEST_PER_CONNECTION: "4"

  # =============================
  #  Kafka Consumer 
  # =============================

  CONSUMER_GROUP_ID: "consgroup"
  CONSUMER_POD_COUNT: "8"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  MAX_MESSAGES: "100"
  ENABLE_AUTO_COMMIT: "false"
  AUTO_OFFSET_RESET: "earliest"
  AUTO_COMMIT_INTERVAL_MS: "0"
  POLL_TIMEOUT: "1"
  POLL_MAX_MSG: "1000" 
  FETCH_MAX_BYTES: "5242880"
  FETCH_MIN_BYTES: "1"
  FETCH_MAX_WAIT_MS: "1"
  MAX_POLL_RECORDS: "1000"
  MAX_POLL_INTERVAL_MS: "120000"
  SESSION_TIMEOUT_MS: "20000"
  HEARTBEAT_INTERVAL_MS: "1000"
  SOCKET_TIMEOUT_MS: "30000"
  LAG_QUERY_TIMEOUT: "5.0"
  LAG_QUERY_INTERVAL: "15"
  MAX_PARTITION_FETCH_BYTES: "4194304"
  SOCKET_SEND_BUFFER_BYTES: "524288"
  SOCKET_RECEIVE_BUFFER_BYTES: "524288"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  CONSUMER_OUTPUT_DIR: "/app/consumer-merge-data/consumer-result"
  PROCESSED_DIR: "/app/consumer-merge-data/consumer-result/processed" 
  
  # =============================
  #  Application
  # =============================
  # App baseline: no artificial delay
  
  APP_DELAY_MODE: "none"
  APP_DELAY_MIN_MS: "0"
  APP_DELAY_MAX_MS: "0"

  # =============================
  # optional burst pacing
  # =============================

  #PACING_MODE: "burst"  
  PACING_MODE: "per_message"    
  PACING_TICK_SEC: "0.005"        
  MIN_BURST: "1"                 
  MAX_BURST: "2000"      

  # =============================
  #  Policy Toggles
  # =============================

  MITIGATION_POLICY: "none" 
  # none | hpa | lag_sensitive | keda
  ENABLE_HPA: "false"
  ENABLE_CONTROLLER: "false"
  ENABLE_KEDA: "false"
  SLA: "99"
  EXP_DURATION_SEC: "900"

  # =============================
  #  Experiments
  # ============================= 

experiments:
  B0_500:
    EXP_ID: "B0_500"
    TOPIC_TITLE: "B0_500"
    TRAFFIC_MODE: "balanced"
    TARGET_RATE: "500"
    SKEW_FRACTION: "0.0"
    SKEW_PARTITION: "-1"

  B0_1500:
    EXP_ID: "B0_1500"
    TOPIC_TITLE: "B0_1500"
    TRAFFIC_MODE: "balanced"
    TARGET_RATE: "1500"
    SKEW_FRACTION: "0.0"
    SKEW_PARTITION: "-1"

  S0_1500:
    EXP_ID: "S0_1500"
    TOPIC_TITLE: "S0_1500"
    TRAFFIC_MODE: "skew"
    TARGET_RATE: "1500"
    SKEW_FRACTION: "0.8"
    SKEW_PARTITION: "0"

  S0_3000:
    EXP_ID: "S0_3000"
    TOPIC_TITLE: "S0_3000"
    TRAFFIC_MODE: "skew"
    TARGET_RATE: "3000"
    SKEW_FRACTION: "0.8"
    SKEW_PARTITION: "0"

  S1:
    EXP_ID: "S1"
    TOPIC_TITLE: "S1"
    TARGET_RATE: "1500"
    TRAFFIC_MODE: "skew"
    SKEW_PARTITION: "0"
    SKEW_FRACTION: "0.8"
    MITIGATION_POLICY: "hpa"
    ENABLE_HPA: "true"
    ENABLE_CONTROLLER: "false"
    ENABLE_KEDA: "false"
    HPA_MIN_REPLICAS: "8"
    HPA_MAX_REPLICAS: "24"
    HPA_CPU_TARGET: "70"

  S2:
    EXP_ID: "S2"
    TOPIC_TITLE: "S2"
    TARGET_RATE: "1500"
    TRAFFIC_MODE: "skew"
    SKEW_PARTITION: "0"
    SKEW_FRACTION: "0.8"
    MITIGATION_POLICY: "lag_sensitive"
    ENABLE_CONTROLLER: "true"
    ENABLE_HPA: "false"
    ENABLE_KEDA: "false"
    CTRL_INTERVAL_SEC: "15"
    CTRL_HOT_LAG_THRESHOLD: "150"
    CTRL_SKEW_RATIO_THRESHOLD: "2.0"

  K1:
    EXP_ID: "K1"
    TOPIC_TITLE: "K1"
    TARGET_RATE: "1500"
    TRAFFIC_MODE: "skew"
    SKEW_PARTITION: "0"
    SKEW_FRACTION: "0.8"
    MITIGATION_POLICY: "keda"
    ENABLE_KEDA: "true"
    ENABLE_CONTROLLER: "false"
    ENABLE_HPA: "false"
    KEDA_MIN_REPLICAS: "8"
    KEDA_MAX_REPLICAS: "24"
    KEDA_POLLING_INTERVAL: "15"
    KEDA_COOLDOWN_PERIOD: "60"
