apiVersion: kafka.strimzi.io/v1beta3
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafkastreamingdata
spec:
  kafka:
    version: 3.8.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      log.retention.ms: 180000
      log.retention.check.interval.ms: 10000
      log.segment.bytes: 134217728
      log.segment.ms: 30000
      message.max.bytes: 1048576
      num.network.threads: 8
      num.io.threads: 16
      log.flush.interval.messages: 1000000
      log.flush.interval.ms: 10000
      queued.max.requests: 5000
      socket.request.max.bytes: 104857600
      replica.fetch.max.bytes: 10485760
      replica.fetch.response.max.bytes: 10485760
      auto.create.topics.enable: true
      delete.topic.enable: true
      inter.broker.listener.name: plain
    storage:
      type: persistent-claim
      class: rook-ceph-block-central
      size: 300Gi
      deleteClaim: false
    resources:
      requests:
        memory: 8Gi
        cpu: 4
      limits:
        memory: 16Gi
        cpu: 8

  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      class: rook-ceph-block-central
      size: 10Gi

  entityOperator:
    topicOperator: {}
    userOperator: {}

