apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-cert
  namespace: kafkastreamingdata
spec:
  commonName: prometheus.kafkastreamingdata.nrp-nautilus.io
  dnsNames:
    - prometheus.kafkastreamingdata.nrp-nautilus.io
  issuerRef:
    kind: Issuer
    name: letsencrypt
  secretName: prometheus-tls-secret

