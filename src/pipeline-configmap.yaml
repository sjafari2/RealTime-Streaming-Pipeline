apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-configmap
  namespace: kafkastreamingdata
data:
  # Shared configuration is changed between runs; each run uses a saved copy.
  NAMESPACE: "kafkastreamingdata"
  RELEASE_NAME: "pip"
  EXP_ID: "balanced-reference"
  TRAFFIC_MODE: "balanced"
  # Per producer: three producers target 700 messages/s in total.
  TARGET_RATE: "233.33333333333334"
  # Production includes 60 s warm-up and 600 s evaluation; drain follows.
  EXP_DURATION_SEC: "660"
  WARMUP_SECONDS: "60"
  DRAIN_SECONDS: "120"
  READINESS_TIMEOUT_SECONDS: "180"
  FINAL_SCRAPE_SECONDS: "15"
  WORKLOAD_SEED: "81"
  MITIGATION_POLICY: "none"

  BOOTSTRAP_SERVERS: "pip-kafka:9092"
  BROKER_COUNT: "3"
  TOPIC_COUNT: "1"
  NUM_PARTITIONS: "60"
  RETENTION_MS: "86400000"
  SEGMENT_MS: "30000"
  CLEANUP_POLICY: "delete"
  REPLICATION_FACTOR: "1"
  MIN_INSYNC_REPLICAS: "1"
  # create_topics.sh writes new identifiers before the next managed run.
  RUN_ID: "run-manual-test"
  TOPIC_TITLE: "manual-test"

  PRODUCER_POD_COUNT: "3"
  PRODUCER_CLIENT_ID: "pipeline-producer"
  ACKS: "all"
  ENABLE_IDEMPOTENCE: "true"
  MAX_IN_FLIGHT_REQUEST_PER_CONNECTION: "5"
  COMPRESSION_TYPE: "lz4"
  LINGER_MS: "5"
  BATCH_SIZE: "65536"
  RETRIES: "2"
  RETRY_BACKOFF_MS: "20"
  REQUEST_TIMEOUT_MS: "10000"
  DELIVERY_TIMEOUT_MS: "30000"
  QUEUE_BUFFERING_MAX_MESSAGES: "50000"
  QUEUE_BUFFERING_MAX_KBYTES: "65536"
  PRODUCER_FLUSH_SECONDS: "30"
  MAX_MESSAGES: "0"
  MAX_BURST: "2"
  DROP_CATCHUP: "true"
  PAYLOAD_SIZE_BYTES: "100"
  PRODUCER_HTTP_PORT: "8001"
  SKEW_FRACTION: "0.8"
  SKEW_PARTITION: "0.2"

  CONSUMER_GROUP_ID: "consgroup"
  CONSUMER_STATIC_MEMBERSHIP: "false" # Controlled startup enables this; each pod supplies its own ID.
  CONSUMER_POD_COUNT: "3"
  CONSUMER_CLIENT_ID: "pipeline-consumer"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  ENABLE_AUTO_COMMIT: "false"
  AUTO_OFFSET_RESET: "earliest"
  COMMIT_INTERVAL_SECONDS: "2"
  POLL_TIMEOUT: "0.1"
  POLL_MAX_MSG: "25"
  FETCH_MAX_BYTES: "5242880"
  FETCH_MIN_BYTES: "1"
  FETCH_MAX_WAIT_MS: "5"
  MAX_PARTITION_FETCH_BYTES: "1048576"
  MAX_POLL_INTERVAL_MS: "120000"
  SESSION_TIMEOUT_MS: "20000"
  HEARTBEAT_INTERVAL_MS: "1000"
  SOCKET_TIMEOUT_MS: "30000"
  CONSUMER_HTTP_PORT: "8002"
  SLO_THRESHOLD_MS: "1000"
  APP_DELAY_MS: "0"
  APP_CPU_ITERATIONS: "2000"
  LAG_QUERY_INTERVAL: "2"
  LAG_QUERY_TIMEOUT: "0.1"
  LAG_QUERY_BUDGET_SEC: "0.2"
  LAG_FRESHNESS_SECONDS: "10"

  # Aggregate measurements stay in Prometheus. These files retain identities and final snapshots.
  PRODUCER_EVIDENCE_DIR: "/app/producer-data/evidence"
  CONSUMER_EVIDENCE_DIR: "/app/consumer-merge-data/evidence"
  OUTCOME_LOG_ENABLED: "true"
  EVIDENCE_MAX_BUFFER: "100000"
