apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-configmap
  namespace: kafkastreamingdata
data:
  # =============================
  #  Kafka Brokers / Topics 
  # =============================
  TOPIC_COUNT: "5"
  TOPIC_TITLE: "rt"
  RETENTION_MS: "180000"
  SEGMENT_MS: "30000"
  CLEANUP_POLICY: "delete"
  NUM_PARTITIONS: "2"
  BROKER_COUNT: "2"
  REPLICATION_FACTOR: "1"
  MIN_INSYNC_REPLICAS: "1"

  # =============================
  #  Kafka Producer 
  # =============================
  PRODUCER_COUNT: "1"
  PRODUCER_POD_COUNT: "1"
  PRODUCER_INPUT_PATH: "producer-data"
  DELAY_BETWEEN_MESSAGES: "0"
  LINGER_MS: "1"
  BATCH_SIZE: "65536"
  COMPRESSION_TYPE: "none"
  MAX_REQUEST_SIZE: "262144"
  ACKS: "1"
  RETRIES: "3"
  RETRY_BACKOFF_MS: "100"
  CONNECTION_MAX_IDLE_MS: "30000"
  RECONNECT_BACKOFF_MS: "100"
  RECONNECT_BACKOFF_MAX_MS: "1000"
  RANDOM_RANGE: "1000"
  REQUEST_TIMEOUT_MS: "5000"
  DELIVERY_TIMEOUT_MS: "15000"
  QUEUE_BUFFERING_MAX_MESSAGES: "10000"
  QUEUE_BUFFERING_MAX_KBYTES: "1048576"
  CLIENT_ID: "pipeline-producer"
  MSG_MAX_BYTES: "131072"
  METADATA_MAX_AGE_MS: "300000"
  TOPIC_METADATA_REFRESH_INTERVAL_MS: "300000" 
  MAX_IN_FLIGHT_REQUEST_PER_CONNECTION: "5"
  TARGET_RATE: "100"
  
  #delivery.timeout.ms >= request.timeout.ms + (retries * retry.backoff.ms) if retries = 0 then delivery.timeout.ms = request.timeout.ms

  # =============================
  #  Kafka Consumer 
  # =============================
  CONSUMER_GROUP_ID: "consgroup"
  CONSUMER_COUNT: "1"
  CONSUMER_POD_COUNT: "2"
  MAX_MESSAGES: "100"
  ENABLE_AUTO_COMMIT: "false"
  AUTO_OFFSET_RESET: "latest"
  AUTO_COMMIT_INTERVAL_MS: "10000"
  POLL_TIMEOUT: "10"
  FETCH_MAX_BYTES: "2097152"
  FETCH_MIN_BYTES: "1"
  FETCH_MAX_WAIT_MS: "1"
  MAX_POLL_RECORDS: "50"
  MAX_POLL_INTERVAL_MS: "120000"
  SESSION_TIMEOUT_MS: "10000"
  HEARTBEAT_INTERVAL_MS: "3000"
  SOCKET_TIMEOUT_MS: "10000"
  LAG_QUERY_TIMEOUT: "5.0"
  LAG_QUERY_INTERVAL: "15"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  CONSUMER_OUTPUT_DIR: "/app/consumer-merge-data/consumer-result"

  # =============================
  # Merge Pod
  # =============================
  MERGE_COUNT: "1"
  MERGE_WAIT_TIME: "5"
  MERGE_WAIT_THRESHOLD: "5"
  MERGE_OUTPUT_DIR: "/app/merged-data/merge-result"
  MERGE_METRICS_DIR: "/app/merged-data/merge-metrics"
  BSP_MODE: "true"
  PROMETHEUS_METRICS : "true"

  # =============================
  #  Request Simulator 
  # =============================
  #REQUEST_COUNT: "1"
  #REQUEST_URL: "http://127.0.0.1:8080/"
  #REQUEST_INPUT_PATH: "./request-data/simulator"
  #REQUEST_OUTPUT_PATH: "./producer-data"

  # =============================
  #  Application 
  # =============================
  APPLICATION_WAIT_TIME: "5"
  APPLICATION_COUNT: "1"

  # =============================
  #  BSP / Monitoring 
  # =============================
  BSP_MODE: "true"
  PROMETHEUS_METRICS: "true"
  USE_CLOCK_DRIFT_CORRECTION: "true"
  DRIFT_ESTIMATE_SECONDS: "0.200"

