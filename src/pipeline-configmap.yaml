apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-configmap
  namespace: kafkastreamingdata
data:
  # =============================
  #  Kafka Brokers / Topics 
  # =============================
  TOPIC_COUNT: "1"
  TOPIC_TITLE: "oliv"
  RETENTION_MS: "180000"
  SEGMENT_MS: "30000"
  CLEANUP_POLICY: "delete"
  NUM_PARTITIONS: "100"
  BROKER_COUNT: "3"
  REPLICATION_FACTOR: "3"
  MIN_INSYNC_REPLICAS: "2"

  # =============================
  #  Kafka Producer 
  # =============================
  PRODUCER_COUNT: "4"
  PRODUCER_POD_COUNT: "4"
  PRODUCER_INPUT_PATH: "producer-data"
  DELAY_BETWEEN_MESSAGES: "0"
  LINGER_MS: "5"
  BATCH_SIZE: "512000"
  COMPRESSION_TYPE: "lz4"
  MAX_REQUEST_SIZE: "1048576"
  ACKS: "1"
  RETRIES: "1000000"
  RETRY_BACKOFF_MS: "5"
  CONNECTION_MAX_IDLE_MS: "30000"
  RECONNECT_BACKOFF_MS: "100"
  RECONNECT_BACKOFF_MAX_MS: "1000"
  RANDOM_RANGE: "1000"
  REQUEST_TIMEOUT_MS: "10000"
  DELIVERY_TIMEOUT_MS: "120000"
  QUEUE_BUFFERING_MAX_MESSAGES: "200000"
  QUEUE_BUFFERING_MAX_KBYTES: "2097152"
  CLIENT_ID: "pipeline-producer"
  MSG_MAX_BYTES: "131072"
  METADATA_MAX_AGE_MS: "120000"
  TOPIC_METADATA_REFRESH_INTERVAL_MS: "120000"
  MAX_IN_FLIGHT_REQUEST_PER_CONNECTION: "5"
  TARGET_RATE: "500"

  # =============================
  #  Kafka Consumer 
  # =============================
  CONSUMER_GROUP_ID: "consgroup"
  CONSUMER_COUNT: "4"
  CONSUMER_POD_COUNT: "4"
  MAX_MESSAGES: "5000"
  ENABLE_AUTO_COMMIT: "true"
  AUTO_OFFSET_RESET: "latest"
  AUTO_COMMIT_INTERVAL_MS: "1000"
  POLL_TIMEOUT: "500"
  FETCH_MAX_BYTES: "5242880"
  FETCH_MIN_BYTES: "262144"
  FETCH_MAX_WAIT_MS: "50"
  MAX_POLL_RECORDS: "5000"
  MAX_POLL_INTERVAL_MS: "300000"
  SESSION_TIMEOUT_MS: "10000"
  HEARTBEAT_INTERVAL_MS: "3000"
  SOCKET_TIMEOUT_MS: "30000"
  LAG_QUERY_TIMEOUT: "5.0"
  LAG_QUERY_INTERVAL: "15"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  CONSUMER_OUTPUT_DIR: "/app/consumer-merge-data/consumer-result"
 
  # =============================
  #  Application
  # =============================
  
  APP_DELAY_MIN_MS: "10"
  APP_DELAY_MAX_MS: "100"
  APP_DELAY_MODE: "simulated" 
 
  # =============================
  #  Merge
  # =============================
 
  MERGE_OUTPUT_DIR: "/app/merged-data/merge-result"
  MERGE_METRICS_DIR: "/app/merged-data/merge-metrics"
  MIN_BLOCKS_FOR_GEV: "20"
  FIT_GEV_INTERNAL_SEC: "60"
  ENABLE_PARQUET: "true"
  GEV_METRIC: "application_consumer"
