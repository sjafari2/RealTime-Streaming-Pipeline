apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-configmap
  namespace: kafkastreamingdata
data:
  # ============================================================
  # General
  # ============================================================
  RELEASE_NAME: "pip"
  NAMESPACE: "kafkastreamingdata"
  EXP_ID: "B0"
  TRAFFIC_MODE: "balanced"
  TARGET_RATE: "500"
  EXP_DURATION_SEC: "900"
  SLA: "800"
  # ============================================================
  # Kafka / Topics
  # ============================================================
  BOOTSTRAP_SERVERS: "pip-kafka:9092"
  TOPIC_COUNT: "1"
  NUM_PARTITIONS: "60"
  RETENTION_MS: "1800000"
  SEGMENT_MS: "600000"
  CLEANUP_POLICY: "delete"
  BROKER_COUNT: "3"
  REPLICATION_FACTOR: "1"
  MIN_INSYNC_REPLICAS: "1"
  # ============================================================
  # Producer
  # ============================================================
  PRODUCER_POD_COUNT: "3"
  ACKS: "1"
  COMPRESSION_TYPE: "lz4"
  PRODUCER_INPUT_PATH: "producer-data"
  DELAY_BETWEEN_MESSAGES: "0"
  LINGER_MS: "0"
  BATCH_SIZE: "65536"
  MAX_REQUEST_SIZE: "1048576"
  RETRIES: "3"
  RETRY_BACKOFF_MS: "20"
  CONNECTION_MAX_IDLE_MS: "30000"
  RECONNECT_BACKOFF_MS: "100"
  RECONNECT_BACKOFF_MAX_MS: "1000"
  RANDOM_RANGE: "1000"
  REQUEST_TIMEOUT_MS: "10000"
  DELIVERY_TIMEOUT_MS: "30000"
  QUEUE_BUFFERING_MAX_MESSAGES: "50000"
  QUEUE_BUFFERING_MAX_KBYTES: "65536"
  PRODUCER_CLIENT_ID: "pipeline-producer"
  MSG_MAX_BYTES: "1048576"
  METADATA_MAX_AGE_MS: "120000"
  TOPIC_METADATA_REFRESH_INTERVAL_MS: "120000"
  MAX_IN_FLIGHT_REQUEST_PER_CONNECTION: "1"
  PACING_MODE: "per_message"
  PACING_TICK_SEC: "0.005"
  MIN_BURST: "1"
  MAX_BURST: "2"
  PRODUCER_HTTP_PORT: "8001"
  PRODUCER_DEBUG: "true"
  PRODUCER_DEBUG_EVERY_N: "20000"
  PRODUCER_HEARTBEAT_SEC: "10"
  DROP_CATCHUP: "true"
  # ============================================================
  # Consumer
  # ============================================================
  CONSUMER_GROUP_ID: "consgroup"
  CONSUMER_POD_COUNT: "8"
  PARTITION_ASSIGNMENT_STRATEGY: "cooperative-sticky"
  MAX_MESSAGES: "10000"
  ENABLE_AUTO_COMMIT: "false"
  AUTO_OFFSET_RESET: "earliest"
  AUTO_COMMIT_INTERVAL_MS: "0"
  POLL_TIMEOUT: "1"
  POLL_MAX_MSG: "200"
  FETCH_MAX_BYTES: "5242880"
  FETCH_MIN_BYTES: "1"
  FETCH_MAX_WAIT_MS: "1"
  MAX_POLL_RECORDS: "100"
  MAX_POLL_INTERVAL_MS: "120000"
  SESSION_TIMEOUT_MS: "20000"
  HEARTBEAT_INTERVAL_MS: "1000"
  SOCKET_TIMEOUT_MS: "30000"
  MAX_PARTITION_FETCH_BYTES: "1048576"
  SOCKET_SEND_BUFFER_BYTES: "524288"
  SOCKET_RECEIVE_BUFFER_BYTES: "524288"
  CONSUMER_OUTPUT_DIR: "/tmp/metrics"
  PROCESSED_DIR: "/tmp/metrics/processed"
  CONSUMER_HTTP_PORT: "8002"
  CONSUMER_DEBUG: "true"
  CONSUMER_DEBUG_EVERY_N: "20000"
  CONSUMER_HEARTBEAT_SEC: "10"
  CONSUMER_CLIENT_ID: "pipeline-consumer"
  PER_MSG_LAT_ENABLED: "true"
  PER_MSG_LAT_SAMPLE_RATE: "0.01"     
  PER_MSG_LAT_FLUSH_SEC: "5"
  PER_MSG_LAT_MAX_BUFFER: "20000"

  # ============================================================
  # Skew / Experiment Control
  # ============================================================
  MITIGATION_POLICY: "none"
  ENABLE_HPA: "false"
  ENABLE_CONTROLLER: "false"
  ENABLE_KEDA: "false"
  SKEW_FRACTION: "0.0"
  SKEW_PARTITION: "0"
  HOT_PARTITION: "0"
  
  LAG_QUERY_INTERVAL: "2"
  LAG_QUERY_TIMEOUT: "3"
  PARTITION_LAG_CSV_ENABLED: "true"

  # ============================================================
  # App Delay
  # ============================================================
  APP_DELAY_MODE: "fixed"
  APP_DELAY_MS: "10"
  APP_DELAY_MAX_MS: "0"
  RUN_ID: "run-20260316-154403"
  TOPIC_TITLE: "B0-R100-20260316-154403"

